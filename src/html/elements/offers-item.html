<div class="offers__item">
  <a class="offers__img border" data-animation="parallax-img" href="@@link">
    <img src="@@img" alt="">
  </a>
  <div class="offers__content">
    <a class="offers__content-title h6" href="@@link">
      @@title
    </a>
    <div class="offers__content-text">
      <p>
        @@text
      </p>
    </div>
    <a class="btn btn--accent" href="@@link">
      Забронировать сейчас
    </a>
    <a class="link link--black" href="@@link">
      <i class="icon-chevron-link"></i>
      Подробнее
    </a>
  </div>
</div>
